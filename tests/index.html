<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem; color: CanvasText; background: Canvas; }
    .pass { color: GrayText; } .fail { font-weight: 600; } pre { white-space: pre-wrap; margin: 0 0 0.5rem 2rem; }
    .summary { font-size: 1.25rem; font-weight: 600; } .summary.bad { text-decoration: underline wavy; }
    table { border-collapse: collapse; margin-bottom: 1rem; } td, th { border: 1px solid GrayText; padding: 2px 8px; text-align: right; }
  </style>
</head>
<body>
  <h1>Tests</h1>
  <p>Serve the repository root (<code>python3 -m http.server 8000</code>) and open <code>/tests/</code>.</p>
  <div id="results"></div>
  <script type="module" src="./run.js"></script>
</body>
</html>
